<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="3;url=https://d1mj9eh74aeeu3.cloudfront.net/" />
    <title>Acadmik has moved</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8fc; color: #322444; font-family: system-ui, sans-serif; }
      main { max-width: 34rem; padding: 2rem; }
      h1 { font-size: clamp(2rem, 6vw, 3rem); }
      a { color: #7137a8; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Your study sidekick has a new home.</h1>
      <p>Notes, practice quizzes, and learning connections now live together on Acadmik.</p>
      <p><a id="destination" href="https://d1mj9eh74aeeu3.cloudfront.net/">Continue to Acadmik →</a></p>
      <p>Legacy quiz links are not migrated. Create new links in the updated app.</p>
    </main>
    <script>
      const routes = {
        '/acadmik/tools-notes': '/notes',
        '/acadmik/tools-quiz': '/quiz',
        '/acadmik/tools': '/notes',
        '/acadmik/privacy-policy': '/privacy',
        '/acadmik/terms-of-service': '/terms',
      };
      const destination = new URL('https://d1mj9eh74aeeu3.cloudfront.net/');
      destination.pathname = routes[window.location.pathname] || '/';
      document.getElementById('destination').href = destination.href;
      window.location.replace(destination.href);
    </script>
  </body>
</html>
